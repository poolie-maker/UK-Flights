<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UK Flights Live</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --ink: #14232b;
    --muted: #5d6f78;
    --paper: #fbfcfc;
    --line: #d5dde1;
    --accent: #0b6e8a;
    --bad: #b3402a;
    --top2: calc(64px + env(safe-area-inset-top, 0px));
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; color: var(--ink); background: #e8eef0; }
  #map { position: absolute; inset: 0; }

  .bar {
    position: absolute; z-index: 1000; left: 12px; right: 12px;
    top: calc(12px + env(safe-area-inset-top, 0px));
    display: flex; gap: 8px; align-items: center; pointer-events: none;
  }
  .bar > * { pointer-events: auto; }
  .search {
    flex: 1; min-width: 0; height: 44px; border: 1px solid var(--line); border-radius: 10px;
    padding: 0 14px; font: inherit; font-size: 16px; background: var(--paper); color: var(--ink);
    box-shadow: 0 1px 3px rgba(20,35,43,.15);
  }
  .search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .fbtn {
    height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--paper); color: var(--ink); font: inherit; font-size: 14px; cursor: pointer;
    box-shadow: 0 1px 3px rgba(20,35,43,.15);
  }
  .fbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .fbtn:focus-visible, .chip:focus-visible, .reset:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .status {
    height: 44px; padding: 0 12px; display: flex; align-items: center; gap: 8px;
    background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
    font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap;
    box-shadow: 0 1px 3px rgba(20,35,43,.15);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .dot.busy { animation: pulse 1s ease-in-out infinite; }
  .dot.err { background: var(--bad); animation: none; }
  .dot.warn { background: #c98a1b; animation: none; }
  @keyframes pulse { 50% { opacity: .25; } }

  .chips {
    position: absolute; z-index: 1000; left: 12px; right: 70px; top: var(--top2);
    display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 18px;
    background: var(--paper); color: var(--ink); font: inherit; font-size: 13px; cursor: pointer;
    box-shadow: 0 1px 3px rgba(20,35,43,.15);
  }
  .chip:active { background: #e3eef2; }

  .panel {
    position: absolute; z-index: 1002; left: 12px; top: calc(108px + env(safe-area-inset-top, 0px));
    width: min(340px, calc(100% - 24px));
    background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; box-shadow: 0 6px 24px rgba(20,35,43,.25);
  }
  .panel[hidden] { display: none; }
  .panel h3 { margin: 0 0 10px; font-size: 15px; }
  .panel label { display: block; font-size: 13px; color: var(--muted); margin-top: 12px; }
  .panel label b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .panel input[type=range] { width: 100%; height: 32px; accent-color: var(--accent); }
  .panel .check { display: flex; align-items: center; gap: 10px; color: var(--ink); font-size: 14px; min-height: 44px; }
  .panel .check input { width: 22px; height: 22px; accent-color: var(--accent); }
  .reset {
    margin-top: 6px; height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px;
    background: none; color: var(--accent); font: inherit; font-size: 14px; cursor: pointer;
  }

  .plane { transition: transform .2s linear; }
  .plane svg { display: block; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
  .plane.sel svg { filter: drop-shadow(0 0 0 #000) drop-shadow(0 0 4px rgba(11,110,138,.9)); }
  .plane.dim { opacity: .25; }

  .legend {
    position: absolute; z-index: 1000; left: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; font-size: 12px; color: var(--muted);
    box-shadow: 0 1px 3px rgba(20,35,43,.15);
  }
  .legend .ramp { height: 6px; width: 120px; border-radius: 3px; margin: 4px 0 2px;
    background: linear-gradient(90deg, hsl(28 85% 48%), hsl(120 55% 38%), hsl(200 75% 40%), hsl(250 60% 45%)); }
  .legend .ends { display: flex; justify-content: space-between; }

  .card {
    position: absolute; z-index: 1001; left: 12px; right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    max-width: 440px; margin: 0 auto;
    background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px 16px; box-shadow: 0 6px 24px rgba(20,35,43,.25);
    transform: translateY(130%); transition: transform .25s ease;
  }
  .card.open { transform: none; }
  .card h2 { margin: 0; font-size: 24px; letter-spacing: .01em; padding-right: 44px; }
  .card .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .route { margin-top: 10px; padding: 8px 10px; background: #eef5f7; border-radius: 8px; display: none; }
  .route .codes { font-size: 18px; font-weight: 700; letter-spacing: .02em; }
  .route .names { font-size: 13px; color: var(--muted); margin-top: 1px; }
  .photo { display: none; margin-top: 10px; }
  .photo a { display: block; }
  .photo img {
    display: block; width: 100%; height: auto; max-height: 180px; object-fit: contain;
    background: #eef5f7; border-radius: 8px;
  }
  .photo .credit { margin-top: 4px; font-size: 11px; color: var(--muted); }
  .photo .credit a { display: inline; color: var(--muted); }
  .card button.close {
    position: absolute; top: 8px; right: 8px; width: 44px; height: 44px; border: 0;
    background: none; font-size: 24px; color: var(--muted); cursor: pointer; border-radius: 10px;
  }
  .card button.close:focus-visible { outline: 2px solid var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 8px; margin-top: 14px; }
  .grid dt { font-size: 12px; color: var(--muted); }
  .grid dd { margin: 2px 0 0; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }

  .apt { position: relative; }
  .apt-dot {
    position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px;
    background: #14232b; border: 2px solid #fff; border-radius: 3px; transform: rotate(45deg);
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  .apt-label {
    display: none; position: absolute; left: 22px; top: 50%; transform: translateY(-50%);
    font-size: 11px; font-weight: 700; letter-spacing: .04em; color: #14232b; white-space: nowrap;
    text-shadow: -1px 0 #fff, 1px 0 #fff, 0 -1px #fff, 0 1px #fff, 0 0 4px #fff;
  }
  .apt-z6 .apt-label.t1, .apt-z8 .apt-label { display: block; }
  .apt-pop b { font-size: 15px; }
  .apt-pop div { color: #5d6f78; font-size: 13px; margin: 2px 0 8px; }
  .apt-pop button {
    height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: #0b6e8a; color: #fff;
    font: inherit; font-size: 14px; cursor: pointer;
  }

  .board {
    position: absolute; z-index: 1001; left: 12px; right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    max-width: 440px; margin: 0 auto;
    background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px 12px; box-shadow: 0 6px 24px rgba(20,35,43,.25);
    transform: translateY(130%); visibility: hidden;
    transition: transform .25s ease, visibility 0s linear .25s;
  }
  .board.open { transform: none; visibility: visible; transition: transform .25s ease; }
  .board h2 { margin: 0; font-size: 20px; padding-right: 44px; }
  .board .sub { color: var(--muted); font-size: 13px; margin-top: 2px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .board .link { border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px; padding: 6px 0; cursor: pointer; text-decoration: underline; }
  .board button.close {
    position: absolute; top: 8px; right: 8px; width: 44px; height: 44px; border: 0;
    background: none; font-size: 24px; color: var(--muted); cursor: pointer; border-radius: 10px;
  }
  .tabs { display: flex; gap: 6px; margin: 10px 0 8px; }
  .tabs button {
    flex: 1; height: 40px; border: 1px solid var(--line); border-radius: 8px; background: none;
    font: inherit; font-size: 13px; color: var(--ink); cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .board .list { max-height: 38vh; overflow-y: auto; }
  .board .row {
    display: flex; justify-content: space-between; gap: 10px; align-items: center; width: 100%;
    min-height: 52px; padding: 6px 4px; border: 0; border-top: 1px solid var(--line); background: none;
    font: inherit; text-align: left; color: var(--ink); cursor: pointer;
  }
  .board .row:first-child { border-top: 0; }
  .board .row .l { min-width: 0; }
  .board .row b { font-size: 16px; }
  .board .row .ty { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .board .row .rt { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board .row .st { font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; flex: none; max-width: 48%; }
  .board .empty { padding: 14px 4px; color: var(--muted); font-size: 14px; }
  .board .note { margin: 8px 0 0; font-size: 11px; color: var(--muted); line-height: 1.35; }
  .board .row:focus-visible, .tabs button:focus-visible, .board .link:focus-visible, .board button.close:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .leaflet-top.leaflet-right { top: calc(env(safe-area-inset-top, 0px) + 64px); }
  .leaflet-tile-pane { filter: grayscale(.85) contrast(.9) brightness(1.08); }
  .leaflet-control-attribution { font-size: 10px; }
  .leaflet-bottom.leaflet-right { bottom: 0; }
  .err-note {
    position: absolute; z-index: 1000; left: 12px; right: 70px; top: calc(108px + env(safe-area-inset-top, 0px));
    background: #fbeae6; color: #7a2a1a; border: 1px solid #e3b3a8; border-radius: 8px;
    padding: 6px 10px; font-size: 12px; display: none;
  }
  @media (max-width: 520px) { .legend { display: none; } .status .txt-long { display: none; } }
  @media (prefers-reduced-motion: reduce) { .plane, .card { transition: none; } .dot.busy { animation: none; } }
</style>
</head>
<body>
<div id="map"></div>

<div class="bar">
  <input class="search" id="q" type="search" placeholder="Find a callsign or registration" autocomplete="off" aria-label="Find a flight">
  <button class="fbtn" id="fbtn" type="button" aria-expanded="false" aria-controls="panel">Filters</button>
  <div class="status" role="status" aria-live="polite"><span class="dot" id="dot"></span><span id="count">0</span><span class="txt-long">aircraft</span></div>
</div>

<div class="chips" id="chips" role="group" aria-label="Jump to an area"></div>

<div class="panel" id="panel" hidden>
  <h3>Filter aircraft</h3>
  <label for="f-alt">Minimum altitude: <b id="o-alt">Any</b></label>
  <input type="range" id="f-alt" min="0" max="40000" step="1000" value="0">
  <label for="f-spd">Minimum speed: <b id="o-spd">Any</b></label>
  <input type="range" id="f-spd" min="0" max="600" step="25" value="0">
  <label class="check"><input type="checkbox" id="f-gnd"> Hide aircraft on the ground</label>
  <label class="check"><input type="checkbox" id="f-apt" checked> Show airports</label>
  <button class="reset" id="f-reset" type="button">Reset filters</button>
</div>

<div class="err-note" id="err"></div>

<div class="legend" aria-hidden="true">
  Altitude
  <div class="ramp"></div>
  <div class="ends"><span>Low</span><span>40,000 ft</span></div>
</div>

<section class="card" id="card" aria-live="polite">
  <button class="close" id="close" aria-label="Close details">&times;</button>
  <h2 id="c-call">—</h2>
  <div class="sub" id="c-sub"></div>
  <div class="route" id="c-route"><div class="codes" id="c-codes"></div><div class="names" id="c-names"></div></div>
  <figure class="photo" id="c-photo" style="margin-left:0;margin-right:0;margin-bottom:0">
    <a id="c-photo-link" href="#" target="_blank" rel="noopener noreferrer"><img id="c-img" alt=""></a>
    <figcaption class="credit"><span id="c-credit"></span> · <a id="c-credit-link" href="#" target="_blank" rel="noopener noreferrer">Planespotters.net</a></figcaption>
  </figure>
  <dl class="grid">
    <div><dt>Altitude</dt><dd id="c-alt"></dd></div>
    <div><dt>Ground speed</dt><dd id="c-spd"></dd></div>
    <div><dt>Heading</dt><dd id="c-hdg"></dd></div>
    <div><dt>Vertical rate</dt><dd id="c-vs"></dd></div>
    <div><dt>Squawk</dt><dd id="c-sq"></dd></div>
    <div><dt>Registration</dt><dd id="c-reg"></dd></div>
  </dl>
</section>

<section class="board" id="board" aria-live="polite" aria-label="Airport live traffic">
  <button class="close" id="b-close" type="button" aria-label="Close airport board">&times;</button>
  <h2 id="b-name"></h2>
  <div class="sub"><span id="b-codes"></span><span aria-hidden="true">·</span><button class="link" id="b-zoom" type="button">Zoom to airport</button></div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="t-arr" aria-selected="true">Arriving</button>
    <button type="button" role="tab" id="t-dep" aria-selected="false">Departing</button>
    <button type="button" role="tab" id="t-gnd" aria-selected="false">On ground</button>
  </div>
  <div class="list" id="b-list"></div>
  <p class="note" id="b-note"></p>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  const REFRESH_MS = 10000;
  const MAX_RADIUS_NM = 250;
  const UK_BOUNDS = [[49.8, -8.7], [60.9, 2.0]];
  const AREAS = [
    ['All UK', null],
    ['Heathrow', [51.470, -0.454]],
    ['Gatwick', [51.154, -0.182]],
    ['Stansted', [51.886, 0.239]],
    ['Manchester', [53.354, -2.275]],
    ['Birmingham', [52.454, -1.748]],
    ['Edinburgh', [55.950, -3.373]],
    ['Glasgow', [55.872, -4.433]],
    ['Newcastle', [55.038, -1.692]],
    ['Bristol', [51.383, -2.719]],
    ['Belfast', [54.658, -6.216]]
  ];

  const map = L.map('map', { zoomControl: false, preferCanvas: true });
  map.fitBounds(UK_BOUNDS);
  L.control.zoom({ position: 'topright' }).addTo(map);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors | Data and paths: adsb.fi / adsb.one / adsb.lol, routes: adsbdb, photos: Planespotters.net',
    maxZoom: 12
  }).addTo(map);

  const $ = id => document.getElementById(id);
  const planes = new Map();   // hex -> {data, marker, trail}
  let selected = null, trailLine = null, filter = '', timer = null, inflight = false;
  const F = { minAlt: 0, minSpd: 0, hideGround: false };
  let failCount = 0;
  let boardApt = null, boardData = [], boardTab = 'arr', boardLoading = false, boardBusy = false, boardError = '', pendingSelect = null;

  const altColor = ft => {
    if (ft == null) return '#7b8a91';
    const t = Math.min(Math.max(ft, 0) / 40000, 1);
    const hue = t < 0.33 ? 28 + (t / 0.33) * 92 : t < 0.66 ? 120 + ((t - 0.33) / 0.33) * 80 : 200 + ((t - 0.66) / 0.34) * 50;
    return `hsl(${hue.toFixed(0)} ${t < 0.33 ? 85 : 65}% ${t < 0.33 ? 48 : 40}%)`;
  };

  const iconHtml = (p, sel) => {
    const c = p.ground ? '#7b8a91' : altColor(p.alt);
    return `<div class="plane${sel ? ' sel' : ''}" style="transform:rotate(${p.track || 0}deg)">
      <svg width="26" height="26" viewBox="0 0 24 24"><path fill="${c}" stroke="#fff" stroke-width="1" d="M12 1.5c.9 0 1.5.8 1.5 1.9v6.1l8 4.6v2.1l-8-2.3v4.3l2.2 1.7v1.6L12 20.6l-3.7 1.1v-1.6l2.2-1.7v-4.3l-8 2.3v-2.1l8-4.6V3.4c0-1.1.6-1.9 1.5-1.9z"/></svg></div>`;
  };
  const makeIcon = (p, sel) => L.divIcon({ className: '', html: iconHtml(p, sel), iconSize: [26, 26], iconAnchor: [13, 13] });

  // ---- data ----------------------------------------------------------
  const mapAc = a => ({
    id: a.hex,
    call: (a.flight || '').trim(),
    reg: a.r || '',
    type: a.t || '',
    lat: a.lat, lon: a.lon,
    ground: a.alt_baro === 'ground',
    alt: typeof a.alt_baro === 'number' ? a.alt_baro : null,
    spd: a.gs != null ? Math.round(a.gs) : null,
    track: a.track ?? a.true_heading ?? 0,
    vs: a.baro_rate ?? null,
    sq: a.squawk || ''
  });

  const qs = new URLSearchParams(location.search);
  let PROXY = '';
  try {
    if (qs.get('relay')) localStorage.setItem('relay', qs.get('relay'));
    PROXY = localStorage.getItem('relay') || '';
  } catch (e) { PROXY = qs.get('relay') || ''; }
  PROXY = PROXY.trim().replace(/\/+$/, '');

  async function fetchFlights() {
    const c = map.getCenter();
    const ne = map.getBounds().getNorthEast();
    const nm = Math.min(MAX_RADIUS_NM, Math.max(25, c.distanceTo(ne) / 1852));
    const r = await fetch(`${PROXY}/v2/point/${c.lat.toFixed(3)}/${c.lng.toFixed(3)}/${Math.round(nm)}`);
    if (!r.ok) {
      const t = await r.text().catch(() => '');
      throw new Error('relay returned ' + r.status + (t ? ' (' + t.slice(0, 140) + ')' : ''));
    }
    const j = await r.json();
    const list = j.ac || j.aircraft || [];
    return list.filter(a => a.lat != null && a.lon != null).map(mapAc);
  }

  // route lookups (origin/destination), cached per callsign
  const routeCache = new Map();
  const routePending = new Set();
  async function loadRoute(call) {
    routePending.add(call);
    try {
      const r = await fetch(`${PROXY}/route/${encodeURIComponent(call)}`);
      if (!r.ok) throw new Error('route ' + r.status);
      const j = await r.json();
      const fr = j && j.response && j.response.flightroute;
      routeCache.set(call, fr && fr.origin && fr.destination ? fr : null);
    } catch (e) {
      routeCache.set(call, null);
    } finally { routePending.delete(call); }
    const e = selected && planes.get(selected);
    if (e && e.data.call.toUpperCase() === call) showCard(e);
    if (boardApt) renderBoard();
  }

  // aircraft photos (latest photo of this exact airframe, so the livery matches the operator)
  const photoCache = new Map();    // hex -> {src, link, by} | null (null = none exists)
  const photoPending = new Set();
  const photoRetryAt = new Map();
  // Planespotters serves thumbnails from a CDN host that isn't always the one in their docs,
  // so accept any https address on one of their own domains.
  const isPsUrl = u => {
    try {
      const x = new URL(u);
      return x.protocol === 'https:' && /(^|\.)(planespotters\.net|plnspttrs\.net)$/.test(x.hostname);
    } catch (e) { return false; }
  };
  async function loadPhoto(p) {
    const key = p.id;
    photoPending.add(key);
    let result = null, definitive = true;
    try {
      for (const [kind, id] of [['hex', p.id], ['reg', p.reg]]) {
        if (!id) continue;
        const r = await fetch(`${PROXY}/photo/${kind}/${encodeURIComponent(id)}`);
        if (!r.ok) { definitive = false; continue; }
        const j = await r.json();
        const ph = j && j.photos && j.photos[0];
        const src = ph && ph.thumbnail_large && ph.thumbnail_large.src;
        if (src && isPsUrl(src)) {
          result = { src, link: isPsUrl(ph.link || '') ? ph.link : '', by: ph.photographer || 'Unknown photographer' };
          break;
        }
      }
    } catch (e) { definitive = false; }
    if (result || definitive) photoCache.set(key, result);
    else photoRetryAt.set(key, Date.now() + 30000);
    photoPending.delete(key);
    const e = selected && planes.get(selected);
    if (e && e.data.id === key) showCard(e);
  }

  // flight path of the selected aircraft: history from the relay, else what we've seen this session
  const traceCache = new Map();     // hex -> { pts: [[lat, lon, alt|0|null], ...] | null, at }
  const tracePending = new Set();
  async function loadTrace(hex) {
    tracePending.add(hex);
    let pts = null;
    try {
      const r = await fetch(`${PROXY}/trace/${encodeURIComponent(hex)}`);
      if (r.ok) {
        const j = await r.json();
        if (Array.isArray(j.pts) && j.pts.length > 1) pts = j.pts;
      }
    } catch (e) {}
    traceCache.set(hex, { pts, at: Date.now() });
    tracePending.delete(hex);
    const e = selected && planes.get(selected);
    if (e && e.data.id === hex) drawTrail(e);
  }

  function drawTrail(e) {
    if (trailLine) { map.removeLayer(trailLine); trailLine = null; }
    const p = e.data, t = traceCache.get(p.id);
    const nowAlt = p.ground ? 0 : p.alt;
    let pts;
    if (t && t.pts) pts = t.pts.concat([[p.lat, p.lon, nowAlt]]);
    else pts = e.trail.map(q => [q[0], q[1], nowAlt]);
    if (pts.length < 2) return;
    const ll = pts.map(q => [q[0], q[1]]);
    const g = L.layerGroup();
    L.polyline(ll, { color: '#fff', weight: 7, opacity: .85, interactive: false, lineCap: 'round', lineJoin: 'round' }).addTo(g);
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i][2];
      L.polyline([ll[i - 1], ll[i]], {
        color: a === 0 ? '#7b8a91' : altColor(a), weight: 4, opacity: 1,
        interactive: false, lineCap: 'round'
      }).addTo(g);
    }
    g.addTo(map);
    trailLine = g;
  }

  function showSetup() {
    const note = $('err');
    note.innerHTML = '';
    note.style.display = 'block';
    const p = document.createElement('div');
    p.textContent = 'Live data needs your free relay. Paste its address (ends in .workers.dev):';
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:6px;margin-top:6px';
    const inp = document.createElement('input');
    inp.type = 'url'; inp.placeholder = 'https://uk-flights.yourname.workers.dev';
    inp.style.cssText = 'flex:1;min-width:0;height:36px;font-size:16px;padding:0 8px;border:1px solid #e3b3a8;border-radius:6px';
    const btn = document.createElement('button');
    btn.textContent = 'Save';
    btn.style.cssText = 'height:36px;padding:0 14px;border:0;border-radius:6px;background:#0b6e8a;color:#fff;font-size:15px';
    btn.onclick = () => {
      const v = inp.value.trim();
      if (!/^https:\/\//.test(v)) return;
      try { localStorage.setItem('relay', v); } catch (e) {}
      PROXY = v.replace(/\/+$/, '');
      note.style.display = 'none';
      refresh();
    };
    row.append(inp, btn);
    note.append(p, row);

  async function refresh() {
    if (inflight) return;
    if (!PROXY) { $('dot').className = 'dot err'; showSetup(); return; }
    inflight = true;
    const dot = $('dot'), note = $('err');
    dot.className = 'dot busy';
    let list;
    try { list = await fetchFlights(); }
    catch (e) {
      // keep showing the last aircraft; retry quickly and only complain if it keeps failing
      failCount++;
      inflight = false;
      if (failCount >= 3) {
        dot.className = 'dot err';
        note.textContent = 'Could not load flights: ' + (e.message || e) + (e instanceof TypeError ? '. Check the relay address and your connection.' : '');
        note.style.display = 'block';
      } else {
        dot.className = 'dot warn';
      }
      if (failCount <= 6) setTimeout(refresh, 3000);
      return;
    }
    failCount = 0;
    note.style.display = 'none';
    try { apply(list); dot.className = 'dot'; }
    catch (e) {
      console.error(e);
      dot.className = 'dot err';
      note.textContent = 'Display error: ' + (e.message || e);
      note.style.display = 'block';
    }
    inflight = false;
  }

  // ---- filtering -----------------------------------------------------
  const matches = p => !filter || p.call.toLowerCase().includes(filter) || p.reg.toLowerCase().includes(filter) || p.id.toLowerCase() === filter;
  const passes = p => {
    if (F.hideGround && p.ground) return false;
    const alt = p.ground ? 0 : (p.alt ?? 0);
    if (alt < F.minAlt) return false;
    if ((p.spd ?? 0) < F.minSpd) return false;
    return true;
  };
  function restyle(e) {
    const el = e.marker.getElement();
    if (!el) return;
    el.style.display = passes(e.data) ? '' : 'none';
    if (el.firstChild) el.firstChild.classList.toggle('dim', !matches(e.data));
  }
  function updateCount() {
    let n = 0;
    for (const e of planes.values()) if (passes(e.data) && matches(e.data)) n++;
    $('count').textContent = n.toLocaleString('en-GB');
  }
  function applyFilters() {
    for (const e of planes.values()) restyle(e);
    updateCount();
    $('fbtn').classList.toggle('on', F.minAlt > 0 || F.minSpd > 0 || F.hideGround);
  }

  // ---- rendering -----------------------------------------------------
  function apply(list) {
    const seen = new Set();
    for (const p of list) {
      seen.add(p.id);
      let e = planes.get(p.id);
      const isSel = selected === p.id;
      if (!e) {
        const marker = L.marker([p.lat, p.lon], { icon: makeIcon(p, isSel), keyboard: false }).addTo(map);
        marker.on('click', ev => { L.DomEvent.stopPropagation(ev); select(p.id); });
        e = { data: p, marker, trail: [] };
        planes.set(p.id, e);
      } else {
        e.data = p;
        e.marker.setLatLng([p.lat, p.lon]);
        e.marker.setIcon(makeIcon(p, isSel));
      }
      e.trail.push([p.lat, p.lon]);
      if (e.trail.length > 120) e.trail.shift();
      restyle(e);
    }
    for (const [id, e] of planes) {
      if (!seen.has(id)) { map.removeLayer(e.marker); planes.delete(id); if (selected === id) deselect(); }
    }
    updateCount();
    if (pendingSelect && planes.has(pendingSelect)) { const id = pendingSelect; pendingSelect = null; select(id); }
    if (selected && planes.has(selected)) showCard(planes.get(selected));
  }

  function select(id) {
    closeBoard();
    const prev = selected;
    selected = id;
    if (prev && planes.has(prev)) planes.get(prev).marker.setIcon(makeIcon(planes.get(prev).data, false));
    const e = planes.get(id);
    if (!e) return;
    e.marker.setIcon(makeIcon(e.data, true));
    restyle(e);
    showCard(e);
  }

  function deselect() {
    if (selected && planes.has(selected)) {

  function showCard(e) {

  // ---- airport live board --------------------------------------------
  // Built from live aircraft within BOARD_RADIUS_NM of the airport (position, altitude,
  // heading, climb/descent) plus route lookups. It is not a timetable.
  const R_NM = 3440.065, RAD = Math.PI / 180, BOARD_RADIUS_NM = 40;
  const distNm = (la1, lo1, la2, lo2) => {
    const a = Math.sin((la2 - la1) * RAD / 2) ** 2 + Math.cos(la1 * RAD) * Math.cos(la2 * RAD) * Math.sin((lo2 - lo1) * RAD / 2) ** 2;
    return 2 * R_NM * Math.asin(Math.sqrt(a));
  };
  const bearing = (la1, lo1, la2, lo2) => {
    const y = Math.sin((lo2 - lo1) * RAD) * Math.cos(la2 * RAD);
    const x = Math.cos(la1 * RAD) * Math.sin(la2 * RAD) - Math.sin(la1 * RAD) * Math.cos(la2 * RAD) * Math.cos((lo2 - lo1) * RAD);
    return (Math.atan2(y, x) / RAD + 360) % 360;
  };
  const angDiff = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };
  const matchApt = (a, apt) => !!a && ((a.icao_code && a.icao_code === apt.icao) || (a.iata_code && a.iata_code === apt.iata));
  const mk = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const code = a => a.iata_code || a.icao_code || '?';
  const place = a => a.municipality || a.name || code(a);
  const TAB_LABEL = { arr: 'Arriving', dep: 'Departing', gnd: 'On ground' };
  const EMPTY = {
    arr: 'No arrivals detected within 40 nm right now.',
    dep: 'No departures detected within 40 nm right now.',
    gnd: 'No aircraft with transponders on the ground here right now.'
  };

  function classify(p, apt) {
    const d = distNm(p.lat, p.lon, apt.lat, apt.lon);
    const info = routeCache.get(p.call.toUpperCase());
    const toApt = !!info && matchApt(info.destination, apt);
    const fromApt = !!info && matchApt(info.origin, apt);
    if (p.ground) {
      if (d > 3) return null;
      return { p, d, info, kind: 'gnd', dir: toApt ? 'arr' : fromApt ? 'dep' : null };
    }
    const alt = p.alt ?? 99999;
    if (alt > 12000 || d > BOARD_RADIUS_NM) return null;
    if (info && !toApt && !fromApt) return null;      // a different flight passing by
    const vs = p.vs ?? 0;
    let kind = null;
    if (toApt && !fromApt) kind = 'arr';
    else if (fromApt && !toApt) kind = 'dep';
    else if (!info) {
      const toward = angDiff(p.track, bearing(p.lat, p.lon, apt.lat, apt.lon)) <= 50;
      const away = angDiff(p.track, bearing(apt.lat, apt.lon, p.lat, p.lon)) <= 50;
      const level = alt < 3000 && d < 10;
      if (toward && alt <= 10000 && (vs <= -300 || level)) kind = 'arr';
      else if (away && alt <= 10000 && (vs >= 400 || level)) kind = 'dep';
    }
    if (!kind) return null;
    return { p, d, info, kind, eta: p.spd > 50 ? d / p.spd * 60 : null };
  }

  function statusText(c) {
    const { p, d } = c;
    const nm = Math.round(d) + ' nm';
    if (c.kind === 'gnd') {
      if (c.dir === 'arr') return 'Arrived';
      if (c.dir === 'dep') return 'Departing soon';
      return p.spd > 5 ? 'Taxiing' : 'Parked or holding';
    }
    const alt = p.alt ?? 0;
    if (c.kind === 'arr') {
      if (alt < 1500 && d < 3) return 'Landing';
      if (alt < 4000 && d <= 12) return 'Final approach · ' + nm;
      return c.eta != null ? 'Arrives in ~' + Math.max(1, Math.round(c.eta)) + ' min · ' + nm : nm + ' out';
    }
    if (alt < 1500 && d < 3) return 'Just took off';
    return 'Climbing · ' + alt.toLocaleString('en-GB') + ' ft · ' + nm;
  }

  function rowEl(c) {
    const { p, info } = c;
    const b = mk('button', 'row');
    b.type = 'button';
    const l = mk('div', 'l');
    const top = mk('div');
    top.append(mk('b', null, p.call || p.id.toUpperCase()));
    if (p.type) top.append(mk('span', 'ty', p.type));
    l.append(top);
    let route = '';
    if (info) {
      const o = info.origin, dd = info.destination;
      route = c.kind === 'arr' ? `from ${place(o)} (${code(o)})`
            : c.kind === 'dep' ? `to ${place(dd)} (${code(dd)})`
            : `${code(o)} → ${code(dd)}`;
    } else if (/^[A-Z]{3}\d/.test(p.call.toUpperCase()) && routePending.has(p.call.toUpperCase())) {
      route = 'Looking up route…';
    }
    if (route) l.append(mk('div', 'rt', route));
    b.append(l, mk('div', 'st', statusText(c)));
    b.addEventListener('click', () => {
      closeBoard();
      pendingSelect = p.id;
      map.flyTo([p.lat, p.lon], 10, { duration: 1 });
    });
    return b;
  }

  function renderBoard() {
    if (!boardApt) return;
    const rows = { arr: [], dep: [], gnd: [] };
    for (const p of boardData) { const c = classify(p, boardApt); if (c) rows[c.kind].push(c); }
    rows.arr.sort((a, b) => (a.eta ?? a.d * 10) - (b.eta ?? b.d * 10));
    rows.dep.sort((a, b) => a.d - b.d);
    rows.gnd.sort((a, b) => a.p.call.localeCompare(b.p.call));
    for (const k of ['arr', 'dep', 'gnd']) {
      const t = $('t-' + k);
      t.textContent = `${TAB_LABEL[k]} (${rows[k].length})`;
      t.setAttribute('aria-selected', String(k === boardTab));
    }
    const list = $('b-list');
    list.replaceChildren();
    const cur = rows[boardTab].slice(0, 40);
    if (!cur.length) list.append(mk('div', 'empty', boardLoading ? 'Loading live traffic…' : EMPTY[boardTab]));
    for (const c of cur) list.append(rowEl(c));
    const pend = [...routePending].length;
    $('b-note').textContent = boardError ||
      ('Live aircraft within 40 nm, worked out from position, altitude and heading, with routes from adsbdb. ' +
       'This is not a timetable: no scheduled times, gates or delays.' + (pend ? ` Checking routes for ${pend} flight${pend > 1 ? 's' : ''}…` : ''));
  }

  async function refreshBoard() {
    const apt = boardApt;
    if (!apt || boardBusy) return;
    if (!PROXY) { boardLoading = false; boardError = 'Set your relay address first (see the banner).'; renderBoard(); return; }
    boardBusy = true;
    try {
      const r = await fetch(`${PROXY}/v2/point/${apt.lat.toFixed(3)}/${apt.lon.toFixed(3)}/${BOARD_RADIUS_NM}`);
      if (!r.ok) throw new Error('relay returned ' + r.status);
      const j = await r.json();
      if (boardApt === apt) {
        boardData = (j.ac || j.aircraft || []).filter(a => a.lat != null && a.lon != null).map(mapAc);
        boardError = '';
        const todo = boardData
          .filter(p => /^[A-Z]{3}\d/.test(p.call.toUpperCase()))
          .filter(p => !routeCache.has(p.call.toUpperCase()) && !routePending.has(p.call.toUpperCase()))
          .filter(p => p.ground ? distNm(p.lat, p.lon, apt.lat, apt.lon) <= 3 : (p.alt ?? 99999) <= 12000)
          .sort((a, b) => distNm(a.lat, a.lon, apt.lat, apt.lon) - distNm(b.lat, b.lon, apt.lat, apt.lon))
          .slice(0, 8);
        for (const p of todo) loadRoute(p.call.toUpperCase());
      }
    } catch (e) {
      boardError = 'Could not load live traffic: ' + (e.message || e);
    } finally {
      boardBusy = false; boardLoading = false;
      renderBoard();
    }
  }

  function openBoard(apt) {
    deselect(); setPanel(false);
    boardApt = apt; boardData = []; boardTab = 'arr'; boardLoading = true; boardError = '';
    $('b-name').textContent = apt.name;
    $('b-codes').textContent = apt.iata + ' · ' + apt.icao;
    $('board').classList.add('open');
    renderBoard();
    refreshBoard();
  }
  function closeBoard() { boardApt = null; $('board').classList.remove('open'); }

  $('b-close').addEventListener('click', closeBoard);
  $('b-zoom').addEventListener('click', () => { if (boardApt) map.flyTo([boardApt.lat, boardApt.lon], 11, { duration: 1 }); });
  for (const k of ['arr', 'dep', 'gnd']) $('t-' + k).addEventListener('click', () => { boardTab = k; renderBoard(); });

  function tick() { refresh(); if (boardApt) setTimeout(refreshBoard, 1500); }

  // ---- events --------------------------------------------------------
  $('close').addEventListener('click', deselect);
  map.on('click', () => { setPanel(false); closeBoard(); deselect(); });
  map.on('moveend', () => { clearTimeout(map._mv); map._mv = setTimeout(refresh, 400); });

  $('q').addEventListener('input', e => {
    filter = e.target.value.trim().toLowerCase();
    let first = null;
    for (const [id, p] of planes) {
      restyle(p);
      if (filter && !first && matches(p.data) && passes(p.data)) first = id;
    }
    updateCount();
    if (first && filter.length >= 3) {
      select(first);
      const d = planes.get(first).data;
      map.panTo([d.lat, d.lon]);
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { clearInterval(timer); timer = null; }
    else if (!timer) { tick(); timer = setInterval(tick, REFRESH_MS); }
  });

  refresh();
  timer = setInterval(tick, REFRESH_MS);
})();
</script>
</body>
</html>
